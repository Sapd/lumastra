# Single-node install: separate web/worker pods, no router, two Valkeys, shared RWO volumes.
router: { enabled: false }
web: { replicas: 1 }
# All pods sharing these RWO claims must be placed on the same node.
global: { nodeSelector: { kubernetes.io/hostname: single-node } }
app: { origin: https://lumastra.example.com }
secrets: { existingSecret: lumastra }
persistence:
    config: { accessModes: [ReadWriteOnce] }
    transcode: { type: emptyDir, emptyDirSizeLimit: 20Gi }
    plugins: { accessModes: [ReadWriteOnce] }
libraries:
    - { name: media, mountPath: /data, hostPath: /srv/media }
