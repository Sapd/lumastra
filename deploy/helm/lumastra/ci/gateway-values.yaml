# Gateway API HTTPRoute + forward-auth (Authentik) on the router, NetworkPolicies, ServiceMonitor.
app: { origin: https://lumastra.example.com }
secrets:
    existingSecret: lumastra
    env:
        LUMASTRA_MASTER_KEY: LUMASTRA_MASTER_KEY
        LUMASTRA_METRICS_BEARER_TOKEN: METRICS_TOKEN
auth:
    native: { enabled: false }
    forwardAuth:
        enabled: true
        userHeader: X-authentik-username
        groupHeader: X-authentik-groups
        nameHeader: X-authentik-name
        trustedProxyIps: 10.42.0.0/16
router:
    realIp: { fromCIDRs: [10.42.0.0/16] }
    forwardAuth:
        enabled: true
        url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
        signinUrl: /outpost.goauthentik.io/start?rd=$lumastra_proto://$http_host$request_uri
        responseHeaders:
            [
                X-authentik-username,
                X-authentik-groups,
                X-authentik-email,
                X-authentik-name,
                X-authentik-uid,
            ]
        stripRequestHeaders:
            [
                X-authentik-username,
                X-authentik-groups,
                X-authentik-email,
                X-authentik-name,
                X-authentik-uid,
            ]
        outpost: { enabled: true, origin: https://auth.example.com }
httpRoute:
    enabled: true
    parentRefs: [{ name: traefik-gateway, namespace: traefik, sectionName: websecure }]
    hostnames: [lumastra.example.com]
networkPolicy:
    enabled: true
    ingressFrom:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
    # ServiceMonitor scrapers must reach the worker through the default internal policy.
    metricsFrom:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
serviceMonitor:
    enabled: true
    bearerTokenSecret: { name: lumastra, key: METRICS_TOKEN }
