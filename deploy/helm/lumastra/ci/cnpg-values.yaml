# CloudNativePG Cluster (non-superuser owner), sonic_reader managed role, Barman Cloud backups.
app: { origin: https://lumastra.example.com }
secrets: { existingSecret: lumastra }
database:
    mode: cnpg
    cnpg:
        instances: 2
        parameters:
            {
                shared_buffers: 3GB,
                work_mem: 16MB,
                log_min_duration_statement: 50ms,
                auto_explain.log_min_duration: 50ms,
            }
        sharedPreloadLibraries: [auto_explain]
        extensions: [vector, pg_trgm, pgcrypto, unaccent, pg_stat_statements]
        storage: { size: 50Gi, storageClass: media-state }
        sonicReader: { enabled: true, passwordSecret: lumastra-sonic-reader }
        backup:
            enabled: true
            configuration:
                destinationPath: s3://backups/lumastra
                endpointURL: https://s3.example.com
                s3Credentials:
                    accessKeyId: { name: lumastra-backup-s3, key: ACCESS_KEY_ID }
                    secretAccessKey: { name: lumastra-backup-s3, key: ACCESS_SECRET_KEY }
                wal: { compression: gzip }
sonic: { enabled: true }
persistence:
    dataAnnotations: { argocd.argoproj.io/sync-options: 'Prune=false,Delete=false' }
