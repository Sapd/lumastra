# CNPG with an ICU default collation (match a source whose datlocprovider is 'i').
app: { origin: https://lumastra.example.com }
secrets: { existingSecret: lumastra }
router: { enabled: false }
database:
    mode: cnpg
    cnpg:
        initdb: { localeProvider: icu, icuLocale: en-US, locale: en_US.utf8, dataChecksums: true }
