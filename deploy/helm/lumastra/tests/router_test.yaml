suite: affinity router
templates: [templates/router.yaml]
set:
    secrets.existingSecret: lumastra
tests:
    - it: hashes the playback grant, then PlaySessionId (not preview-*), then client IP, over re-resolved Ready pods
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'map \$arg_playsessionid \$lumastra_session_key',
                }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: '~\^preview-\s+"";' }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'map "\$arg_grant\|\$lumastra_session_key" \$lumastra_route_key',
                }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'default\s+"ip:\$remote_addr";' }
          - matchRegex:
                { path: 'data["nginx.conf"]', pattern: 'hash \$lumastra_route_key consistent;' }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'server RELEASE-NAME-lumastra-web-0\.RELEASE-NAME-lumastra-web-headless\.NAMESPACE\.svc\.cluster\.local:3000 resolve',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'server RELEASE-NAME-lumastra-web-1\.RELEASE-NAME-lumastra-web-headless\.NAMESPACE\.svc\.cluster\.local:3000 resolve',
                }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'lumastra-web-2\.' }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'resolver kube-dns\.kube-system\.svc\.cluster\.local valid=5s',
                }
    - it: streams without buffering, long timeouts, 50m bodies, websockets
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'proxy_buffering off;' }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'proxy_read_timeout 3600s;' }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'client_max_body_size 50m;' }
          - matchRegex:
                { path: 'data["nginx.conf"]', pattern: 'proxy_set_header Upgrade \$http_upgrade;' }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'auth_request' }
    - it: logs paths only (query strings carry tokens)
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: '"\$request_method \$uri"' }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'request_uri.*status' }
    - it: real client IP from the trusted edge
      set: { router.realIp.fromCIDRs: [10.42.0.0/16] }
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'set_real_ip_from 10\.42\.0\.0/16;' }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'real_ip_recursive on;' }
    - it: forward-auth gates everything except the app-authenticated paths and strips identity headers
      set:
          auth.forwardAuth.enabled: true
          auth.forwardAuth.userHeader: X-authentik-username
          auth.forwardAuth.groupHeader: X-authentik-groups
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.responseHeaders: [X-authentik-username, X-authentik-groups]
          router.forwardAuth.stripRequestHeaders: [X-authentik-email]
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /j/ \{[^}]*proxy_set_header X-authentik-username "";',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /subsonic/ \{[^}]*proxy_set_header X-authentik-email "";',
                }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'location \^~ /oauth/ \{' }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /api/v1/ \{\s*auth_request /__lumastra_auth;\s*error_page 401 = @lumastra_noauth;',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location / \{\s*auth_request /__lumastra_auth;\s*error_page 401 = @lumastra_signin;',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'proxy_set_header X-authentik-username \$lumastra_ah_0;',
                }
          - notMatchRegex:
                { path: 'data["nginx.conf"]', pattern: 'location \^~ /j/ \{[^}]*auth_request' }
    # The MAL account-linking callback needs the signed-in user; the rest of /oauth/ (device flow)
    # bypasses the IdP. /oauth/links/ tries the IdP and passes through without identity on 401,
    # also when an operator's own bypassPaths list still holds /oauth/ (prod's does).
    - it: /oauth/links/ tries forward-auth even though /oauth/ bypasses it
      set:
          auth.forwardAuth.enabled: true
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.apiV1Passthrough: false
          router.forwardAuth.bypassPaths: [/j/, /subsonic/, /oauth/]
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'location \^~ /oauth/ \{' }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /oauth/links/ \{\s*auth_request /__lumastra_auth;\s*error_page 401 = @lumastra_noauth;',
                }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'location @lumastra_noauth \{' }
    - it: /oauth/links/ listed in bypassPaths stays a plain bypass (no duplicate location)
      set:
          auth.forwardAuth.enabled: true
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.bypassPaths: [/oauth/, /oauth/links/]
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /oauth/links/ \{\s*# \$http_host',
                }
          - notMatchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /oauth/links/ \{\s*auth_request',
                }
    - it: /oauth/links/ already in extraPassthroughPaths renders one location, not two
      set:
          auth.forwardAuth.enabled: true
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.extraPassthroughPaths: [/oauth/links/]
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /oauth/links/ \{\s*auth_request /__lumastra_auth;',
                }
          - notMatchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: '(?s)location \^~ /oauth/links/ \{.*location \^~ /oauth/links/ \{',
                }
    - it: oauthLinksPassthrough false renders no /oauth/links/ location
      set:
          auth.forwardAuth.enabled: true
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.oauthLinksPassthrough: false
      documentIndex: 0
      asserts:
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: '/oauth/links/' }
    # auth_request answers anything but 2xx/401/403 with a 500 (prod 2026-10-02: Authentik 404 for
    # an in-cluster Host). The auth location turns those into 401, so each location's fallback runs.
    - it: an auth endpoint 3xx/404/5xx/timeout counts as 401, not a 500
      set:
          auth.forwardAuth.enabled: true
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.extraPassthroughPaths: [/api/playback/]
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location = /__lumastra_auth \{[^}]*proxy_intercept_errors on;\s*error_page 300 301 302 303 307 308 400 404 405 408 429 500 502 503 504 = @lumastra_auth_failed;\s*\}',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location @lumastra_auth_failed \{\s*return 401;\s*\}',
                }
          # 401/403 stay the endpoint's own verdict (403 = explicit deny reaches the client)
          - notMatchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'error_page [0-9 ]*\b40[13]\b[0-9 ]* = @lumastra_auth_failed',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /api/playback/ \{\s*auth_request /__lumastra_auth;\s*error_page 401 = @lumastra_noauth;\s*auth_request_set \$lumastra_auth_status \$upstream_status;',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: "session=\\$arg_playsessionid' ' aus=\\$lumastra_auth_status';",
                }
    - it: without forward-auth the log has no auth status (the variable would not exist)
      documentIndex: 0
      asserts:
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'lumastra_auth_status' }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'proxy_intercept_errors' }
    - it: forward-auth needs a URL
      set: { router.forwardAuth.enabled: true }
      asserts:
          - failedTemplate:
                { errorMessage: router.forwardAuth.url is required when router.forwardAuth.enabled }
    - it: router runs nginx unprivileged with a read-only root
      documentIndex: 1
      asserts:
          - isKind: { of: Deployment }
          - equal: { path: spec.replicas, value: 2 }
          - equal:
                {
                    path: 'spec.template.spec.containers[0].image',
                    value: docker.io/nginxinc/nginx-unprivileged:1.29-alpine,
                }
          - equal:
                {
                    path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem',
                    value: true,
                }
          - equal: { path: spec.template.spec.securityContext.runAsUser, value: 101 }
    - it: disabled router renders nothing
      set: { router.enabled: false }
      asserts:
          - hasDocuments: { count: 0 }
    - it: one upstream line per web slot (room to scale without re-rendering the router)
      set: { web.replicas: 2, router.webSlots: 5 }
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'lumastra-web-4\.RELEASE-NAME-lumastra-web-headless',
                }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'lumastra-web-5\.' }
    - it: by default exactly one upstream line per web replica (no empty slots to re-resolve)
      set: { web.replicas: 2 }
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'lumastra-web-1\.' }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'lumastra-web-2\.' }
    - it: web stopped (replicas 0) renders a static placeholder, nothing to resolve
      set: { web.replicas: 0 }
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'server 127\.0\.0\.1:9 down;' }
          - notMatchRegex: { path: 'data["nginx.conf"]', pattern: 'resolve max_fails' }
    - it: long identity header names fit the proxy headers hash
      documentIndex: 0
      asserts:
          - matchRegex:
                { path: 'data["nginx.conf"]', pattern: 'proxy_headers_hash_bucket_size 128;' }
    - it: auth and outpost requests carry the endpoint's own Host by default, the app host in X-Forwarded-Host
      set:
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.outpost: { enabled: true, origin: https://auth.example.com }
      documentIndex: 0
      asserts:
          - notMatchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location = /__lumastra_auth \{[^}]*proxy_set_header Host ',
                }
          - notMatchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /outpost\.goauthentik\.io \{[^}]*proxy_set_header Host ',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /outpost\.goauthentik\.io \{[^}]*proxy_set_header X-Forwarded-Host \$http_host;',
                }
    - it: auth and outpost Host headers are configurable (an outpost that routes by the app host)
      set:
          router.forwardAuth.enabled: true
          router.forwardAuth.url: http://ak-outpost.authentik:9000/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.hostHeader: $host
          router.forwardAuth.outpost:
              { enabled: true, origin: 'http://ak-outpost.authentik:9000', hostHeader: $host }
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location = /__lumastra_auth \{[^}]*proxy_set_header Host \$host;',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /outpost\.goauthentik\.io \{[^}]*proxy_set_header Host \$host;',
                }
    - it: router pods roll when the rendered config changes (e.g. web slots)
      set: { web.replicas: 3 }
      documentIndex: 1
      asserts:
          - exists: { path: 'spec.template.metadata.annotations["checksum/config"]' }
    - it: auth endpoints are TLS-verified; extra passthrough prefixes behave like /api/v1/
      set:
          router.forwardAuth.enabled: true
          router.forwardAuth.url: https://auth.example.com/outpost.goauthentik.io/auth/nginx
          router.forwardAuth.signinUrl: /start?rd=$lumastra_proto://$http_host$request_uri
          router.forwardAuth.extraPassthroughPaths: [/api/playback/]
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'proxy_ssl_verify on;' }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates\.crt;',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'location \^~ /api/playback/ \{\s*auth_request /__lumastra_auth;\s*error_page 401 = @lumastra_noauth;',
                }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'return 302 "/start\?rd=' }
    - it: no session key moves on a single upstream error; keepalive shorter than Node's
      documentIndex: 0
      asserts:
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'resolve max_fails=0;' }
          - matchRegex: { path: 'data["nginx.conf"]', pattern: 'keepalive_timeout 4s;' }
    - it: resolver follows clusterDomain unless set
      set: { router.clusterDomain: k8s.example }
      documentIndex: 0
      asserts:
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'resolver kube-dns\.kube-system\.svc\.k8s\.example valid=5s',
                }
          - matchRegex:
                {
                    path: 'data["nginx.conf"]',
                    pattern: 'web-0\.RELEASE-NAME-lumastra-web-headless\.NAMESPACE\.svc\.k8s\.example:3000',
                }
    - it: router drains gracefully (SIGQUIT) instead of nginx's fast SIGTERM shutdown
      documentIndex: 1
      asserts:
          - matchRegex:
                {
                    path: 'spec.template.spec.containers[0].lifecycle.preStop.exec.command[2]',
                    pattern: 'kill -QUIT',
                }
          - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 60 }
    - it: upstream Host keeps the port
      documentIndex: 0
      asserts:
          - matchRegex:
                { path: 'data["nginx.conf"]', pattern: 'proxy_set_header Host \$http_host;' }
