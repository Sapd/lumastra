# Media library volume — OPTION A: a normal PVC (block or NFS).
# Apply EITHER this file OR media-s3-mountpoint.yaml — both define the claim
# `lumastra-media` that web.yaml and worker.yaml mount read-only at /data.
#
# Point this at wherever your media actually lives: a pre-provisioned NFS export,
# a CSI volume, or an existing PV. The worker scans subdirectories of /data as
# library roots (e.g. /data/movies, /data/series) once you register them in
# Admin → Library.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: lumastra-media
    namespace: lumastra
spec:
    accessModes: ['ReadWriteMany'] # web pods read it too (direct play / transcoding); RWO only if every pod runs on one node
    storageClassName: your-media-storageclass
    resources:
        requests:
            storage: 500Gi
