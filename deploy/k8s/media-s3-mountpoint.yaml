# Media library volume — OPTION B: an S3 bucket mounted read-only via the
# Mountpoint-for-Amazon-S3 CSI driver. Works with any S3-compatible object store
# (AWS S3, MinIO, Ceph RGW, …). Apply EITHER this file OR media-block.yaml.
#
# Validated on a managed Kubernetes cluster with S3-compatible storage. Lay your objects out by library:
#   s3://<bucket>/movies/...   s3://<bucket>/series/...   s3://<bucket>/music/...
# They appear as /data/movies, /data/series, … under the mount.
#
# Prereqs (one-time):
#   1. Install the CSI driver:
#        helm repo add aws-mountpoint-s3-csi-driver \
#          https://awslabs.github.io/mountpoint-s3-csi-driver
#        kubectl create namespace mountpoint-s3
#        kubectl -n mountpoint-s3 create secret generic s3-credentials \
#          --from-literal=key_id=<ACCESS_KEY> --from-literal=access_key=<SECRET_KEY>
#        helm upgrade --install aws-mountpoint-s3-csi-driver \
#          aws-mountpoint-s3-csi-driver/aws-mountpoint-s3-csi-driver \
#          -n mountpoint-s3 --set awsAccessSecret.name=s3-credentials
#   2. Use a bucket-scoped, read-only key (least privilege): create it with your
#      provider's IAM so it can only list and read <bucket>.
#
# CONSISTENCY CAVEAT: Mountpoint is a FUSE filesystem and does NOT emit inotify
# events, so the live file watcher will NOT notice files added to the bucket
# out-of-band. The scheduled `file-library-scan` (hourly) re-lists directories and
# picks them up; trigger it sooner from Admin → Library after a bulk upload.
# See the "Media on object storage" section of the Kubernetes deploy guide.
---
apiVersion: v1
kind: PersistentVolume
metadata:
    name: lumastra-media-s3
spec:
    capacity:
        storage: 1Gi # ignored by the CSI driver, but required by the API
    accessModes: ['ReadWriteMany']
    persistentVolumeReclaimPolicy: Retain
    storageClassName: '' # static provisioning — no StorageClass
    claimRef:
        namespace: lumastra
        name: lumastra-media
    mountOptions:
        - region <REGION> # e.g. us-east-1 (AWS)
        - endpoint-url https://<S3_ENDPOINT> # e.g. https://s3.us-east-1.amazonaws.com
        - uid 1000 # the image runs as uid/gid 1000 (node)
        - gid 1000
        - allow-other # required so the container user can read
        - read-only
        # SCALING: the library scan stat()s every file each cycle. With the default
        # metadata TTL ("minimal") each stat() round-trips to S3 as a HEAD, so a large
        # library makes every (hourly) scan O(files) HEAD requests. `indefinite` lets
        # the directory LIST populate metadata once and serve all stat()s from cache,
        # making a full scan LIST-bound instead. Safe here because the library is
        # read-only and ingest is scan-triggered, not watched. See the deploy guide's
        # "Scaling object-storage scans".
        - metadata-ttl indefinite
    csi:
        driver: s3.csi.aws.com
        volumeHandle: lumastra-media-s3 # must be unique per PV
        volumeAttributes:
            bucketName: <BUCKET>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: lumastra-media
    namespace: lumastra
spec:
    accessModes: ['ReadWriteMany']
    storageClassName: ''
    volumeName: lumastra-media-s3
    resources:
        requests:
            storage: 1Gi
