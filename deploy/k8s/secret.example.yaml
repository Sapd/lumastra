# EXAMPLE secret — DO NOT commit real values. Copy to secret.yaml, fill in, and
# apply that (secret.yaml is gitignored by the .gitignore in this directory).
#
# Generate the random keys with:
#   openssl rand -hex 32      # LUMASTRA_MASTER_KEY and JWT_SECRET (32-byte hex each)
#
# LUMASTRA_MASTER_KEY encrypts stored config secrets at rest — back it up
# separately; rotating it makes previously-encrypted settings unreadable.
apiVersion: v1
kind: Secret
metadata:
    name: lumastra-secrets
    namespace: lumastra
type: Opaque
stringData:
    # Postgres (pgvector). Must match postgres.yaml's POSTGRES_* values.
    DATABASE_URL: 'postgresql://lumastra:CHANGE_ME_DB_PASSWORD@lumastra-postgres:5432/lumastra'
    DATABASE_PASSWORD: 'CHANGE_ME_DB_PASSWORD'
    # Valkey — capped, evictable application cache (allkeys-lru). Disposable.
    CACHE_URL: 'redis://default:CHANGE_ME_CACHE_PASSWORD@lumastra-valkey-cache:6379/0'
    # Valkey — durable task keyspace / BullMQ (noeviction, AOF). Required, and it must be a
    # different instance from CACHE_URL (startup rejects equal URLs).
    TASK_CACHE_URL: 'redis://default:CHANGE_ME_CACHE_PASSWORD@lumastra-valkey-tasks:6379/0'
    # Used by both Valkey instances. Use only letters, digits and - . _ ~ (openssl rand -hex 24):
    # it is part of the two URLs above, which are not percent-encoded for you.
    CACHE_PASSWORD: 'CHANGE_ME_CACHE_PASSWORD'
    # 32-byte hex. Encrypts stored secrets at rest — BACK THIS UP.
    LUMASTRA_MASTER_KEY: 'CHANGE_ME_64_hex_chars'
    # 32-byte hex. Signs JWTs (device auth / stream tokens).
    JWT_SECRET: 'CHANGE_ME_64_hex_chars'
    # Metadata + AI enrichment (optional but recommended). TMDB v4 read token.
    TMDB_API_KEY: 'CHANGE_ME_TMDB_V4_TOKEN'
    OPENAI_API_KEY: 'CHANGE_ME_OPENAI_KEY'
