apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lumastra

# Baseline stack. Edit the placeholders (storage classes, hostname, image tag) and
# create your own secret.yaml (copy secret.example.yaml) before applying:
#   kubectl apply -k deploy/k8s/
#   kubectl -n lumastra apply -f deploy/k8s/secret.yaml   # not tracked by git
resources:
    - namespace.yaml
    - configmap.yaml
    - postgres.yaml
    - valkey.yaml
    - config-pvc.yaml
    - media-block.yaml # swap for media-s3-mountpoint.yaml to use object storage
    - web.yaml
    - worker.yaml
    - ingress-nginx.yaml # swap for gateway-traefik.yaml to use Gateway API
    - network-policy.yaml

# The Secret is intentionally NOT listed here — keep real credentials out of the
# repo. Apply your filled-in secret.yaml separately, or uncomment to let Kustomize
# build it from a local env file (also gitignored):
# secretGenerator:
#   - name: lumastra-secrets
#     envs: [secret.env]
#     options: { disableNameSuffixHash: true }
