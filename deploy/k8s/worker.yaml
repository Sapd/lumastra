# Worker tier — task runner, file scanner, AI enrichment, trickplay.
# EXACTLY ONE replica: running multiple workers is not a supported topology.
# Scale it VERTICALLY (CPU/RAM + per-class concurrency), never horizontally.
#
# Mounts both the shared /config (RWX) and the media library (read-only). The
# media volume is defined in media-block.yaml (or media-s3-mountpoint.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: lumastra-worker
    namespace: lumastra
spec:
    replicas: 1
    strategy:
        type: Recreate # never run two workers at once, even briefly during rollout
    selector:
        matchLabels: { app: lumastra, role: worker }
    template:
        metadata:
            labels: { app: lumastra, role: worker }
        spec:
            automountServiceAccountToken: false # worker has no Kubernetes API client
            # Running jobs get time to finish on a rollout or node drain (the default is 30 s).
            terminationGracePeriodSeconds: 120
            # imagePullSecrets:
            #   - name: ghcr-pull
            #
            # See web.yaml for why: fixed non-root uid/gid, fsGroup fixes volume
            # ownership regardless of the image's own default user.
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                fsGroup: 1000
                seccompProfile: { type: RuntimeDefault }
            containers:
                - name: lumastra-worker
                  image: ghcr.io/lumastra/lumastra:stable
                  # `args`, not `command`: `command` replaces the image ENTRYPOINT
                  # (tini, which reaps orphaned FFmpeg children); `args` replaces
                  # only its CMD.
                  args: ['./start-worker.sh'] # forces WORKER_MODE=enabled
                  # See web.yaml's container securityContext note.
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: [ALL] }
                      readOnlyRootFilesystem: true
                  env:
                      - name: WORKER_MODE
                        value: enabled
                      - name: DEDICATED_WORKER
                        value: 'true'
                      - name: IMAGE_SYNC_AUTO_VIDEO_EXTRACTION
                        value: 'true'
                      - name: INSTANCE_ID
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name
                  envFrom:
                      - configMapRef: { name: lumastra-config }
                      - secretRef: { name: lumastra-secrets }
                  volumeMounts:
                      - { name: config, mountPath: /config }
                      - { name: media, mountPath: /data, readOnly: true }
                      # readOnlyRootFilesystem needs this: ffmpeg/analysis temp
                      # files and the worker's own liveness-watchdog marker file
                      # both land under /tmp — see README Hardening.
                      - { name: tmp, mountPath: /tmp }
                  livenessProbe:
                      httpGet: { path: /api/health, port: 3000 }
                      initialDelaySeconds: 60
                      periodSeconds: 30
                  # Not ready while another worker holds the singleton lease, during a prepared
                  # upgrade, or without PostgreSQL / task Valkey; the body lists the reasons.
                  readinessProbe:
                      httpGet: { path: /api/health/ready, port: 3000 }
                      periodSeconds: 15
                  resources:
                      requests: { cpu: '500m', memory: '1Gi' }
                      limits: { memory: '4Gi' } # ffmpeg / analysis can be heavy
            volumes:
                - name: config
                  persistentVolumeClaim: { claimName: lumastra-config }
                - name: media
                  persistentVolumeClaim: { claimName: lumastra-media }
                - { name: tmp, emptyDir: {} }
