[package]
name = "lumastra-livetv-proxy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "io-util", "sync", "fs"] }
url = "=2.5.8"
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.10"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
percent-encoding = "=2.3.2"
# Already locked through tokio-rustls; used for SHA-256 of the boot id only.
ring = { version = "=0.17.14", default-features = false }
httpdate = "=1.0.3"
futures-core = "=0.3.34"
notify = "=8.2.0"
libc = "=0.2.191"
getrandom = "=0.3.4"

[features]
# Opt-in qualification tooling; never part of a default build.
soak = []

[[example]]
name = "upstream_soak"
required-features = ["soak"]

[profile.release]
lto = "thin"
strip = true
