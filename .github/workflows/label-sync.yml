name: Label sync

# Keeps the repo's labels equal to .github/labels.yml (the taxonomy the issue forms and the
# PR labeler rely on). Runs when the file changes and on manual dispatch.

on:
    push:
        branches: [main]
        paths: ['.github/labels.yml', '.github/workflows/label-sync.yml']
    workflow_dispatch:

permissions:
    contents: read # checkout needs it while the repo is private
    issues: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Sync labels
              uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
              with:
                  config-file: .github/labels.yml
                  delete-other-labels: false
