name: PR labeler

# Auto-labels every PR with area:* (by changed paths) and size:* (by diff size).
# The size label is the objective, unspoofable signal for triage — a big PR shows
# up as size:XL regardless of who opened it or how it was written.
on:
    pull_request_target:
        types: [opened, synchronize, reopened, edited]

# pull_request_target runs in the BASE repo context so the token can write labels
# on fork PRs. NEVER add a checkout of PR head code to this workflow.
permissions:
    contents: read
    pull-requests: write

# One labeling run per PR; a newer event supersedes the older one. Safe to cancel: it only sets labels.
concurrency:
    group: pr-labeler-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label:
        runs-on: ubuntu-latest
        steps:
            - name: Area labels (by path)
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
              with:
                  configuration-path: .github/labeler.yml
                  sync-labels: true

            # The PR template's AI-disclosure checkboxes → an `ai-assisted` label, so the
            # disclosure is visible in the PR list, not only in the body. Reads the body
            # only; never checks out or runs PR code.
            - name: AI-assistance label (from the template)
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const body = context.payload.pull_request.body || '';
                      const substantial = /- \[x\] \*\*(Parts|Most)\b/i.test(body);
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const { data: labels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
                      const has = labels.some((l) => l.name === 'ai-assisted');
                      if (substantial && !has) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['ai-assisted'] });
                      if (!substantial && has) await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'ai-assisted' });

            - name: Size label (by diff)
              uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
              with:
                  xs_label: 'size:XS'
                  xs_max_size: '20'
                  s_label: 'size:S'
                  s_max_size: '100'
                  m_label: 'size:M'
                  m_max_size: '400'
                  l_label: 'size:L'
                  l_max_size: '1000'
                  xl_label: 'size:XL'
                  message_if_xl: >
                      This PR is large. Big changes are much easier to accept when they've been
                      discussed first — please make sure it references an accepted issue, and
                      consider splitting it into smaller, independently reviewable pieces.
