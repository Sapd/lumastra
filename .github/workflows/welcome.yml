name: Welcome

# Greets a first-time contributor on their first issue or PR. The action only posts a
# comment; it never checks out or runs code from the PR, so pull_request_target is safe here.

on:
    issues:
        types: [opened]
    pull_request_target:
        types: [opened]

permissions: {}

jobs:
    welcome:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
              with:
                  issue_message: |
                      Thanks for opening your first issue here!

                      A few pointers so it gets looked at quickly:
                      - Questions and setup help belong in [Q&A](https://github.com/Sapd/lumastra/discussions/categories/q-a), and feature ideas in [Features](https://github.com/Sapd/lumastra/discussions/categories/features), where others can upvote them.
                      - For a bug, the diagnostics export (**Admin → System → Diagnostics → Export Diagnostics → Copy for GitHub**) answers most follow-up questions in one go.
                      - Lumastra is an early release (v0.1), so please also check [known limitations](https://lumastra.org/reference/known-limitations/).
                  pr_message: |
                      Thanks for your first pull request!

                      Before review:
                      - Please read [CONTRIBUTING.md](https://github.com/Sapd/lumastra/blob/main/.github/CONTRIBUTING.md) and, if you used AI tools, [CONTRIBUTING-AI.md](https://github.com/Sapd/lumastra/blob/main/.github/CONTRIBUTING-AI.md). In short: you are the author, so you need to understand and have run what you submit.
                      - The CLA bot will ask you to sign the [Contributor License Agreement](https://github.com/Sapd/lumastra/blob/main/.github/CLA.md) with a comment. That's needed once.
                      - Larger features need an accepted idea in [Features](https://github.com/Sapd/lumastra/discussions/categories/features) first.
