name: Lint

# ESLint (the full `npm run lint`: tier check, callback-safety rules, fast + type-aware ESLint,
# licence boundary, operator-copy check), the Svelte component type check, and the guard that
# every action in .github/workflows is pinned by commit SHA. The type-aware ESLint pass peaks
# near 5 GB of memory; the 16 GB GitHub-hosted runners for public repositories have room for it.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# PRs: a new push supersedes the running check. main: queue, so every run finishes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out the repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22
                  cache: npm

            # --legacy-peer-deps matches the Dockerfile (see typecheck.yml).
            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            # The type-aware pass resolves the generated modules, so create them first.
            - name: Generate build artifacts
              run: |
                  npx svelte-kit sync
                  npm run paraglide:compile
                  npm run openapi:types

            - name: ESLint and repository checks
              run: npm run lint

            - name: Workflow actions are pinned by commit SHA
              run: node scripts/check-actions-pinned.mjs

    svelte-types:
        name: Svelte component types
        # On demand only for now: svelte-check peaks at ~11.6 GB and does not finish on a 16 GB
        # hosted runner, even with swap (2026-11-03). Maintainers run it before merging a pull
        # request that touches .svelte files. Make it automatic again once it needs less memory.
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            # svelte-check peaks at ~11.6 GB (measured 2026-11-03) and the hosted runner has
            # 16 GB, so without extra swap the runner is killed. A stopgap until the check
            # needs less memory.
            - name: Add swap
              run: |
                  sudo swapoff -a || true
                  sudo fallocate -l 10G /mnt/ci-swapfile
                  sudo chmod 600 /mnt/ci-swapfile
                  sudo mkswap /mnt/ci-swapfile
                  sudo swapon /mnt/ci-swapfile
                  free -h

            - name: Check out the repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Generate build artifacts
              run: |
                  npx svelte-kit sync
                  npm run paraglide:compile
                  npm run openapi:types

            # svelte-check over every component (~4 min); the script sets its own heap size.
            - name: Type-check Svelte components
              run: npm run check:svelte-types
