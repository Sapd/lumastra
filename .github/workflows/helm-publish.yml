name: Helm chart

# Publishes the Helm chart as an OCI artifact to GHCR and keeps the Artifact Hub listing
# metadata next to it:
#
#   oci://ghcr.io/lumastra/charts/lumastra          chart, one tag per version (0.2.0)
#   ghcr.io/lumastra/charts/lumastra:artifacthub.io  artifacthub-repo.yml (listing metadata)
#
# Runs on release tags (vX.Y.Z, vX.Y.Z-rc1): chart version and appVersion become the tag
# without the leading "v". A hand-started run (workflow_dispatch) publishes an existing tag
# again, for example the first release that predates this workflow:
#   tag        the release tag to publish (v0.2.0)
#   chart_ref  git ref the chart files come from; empty = the tag itself. Use `main` to
#              publish a tag's version with the newer Chart.yaml annotations.
# Publishing an already existing version overwrites the tag in the registry.
#
# Like docker-publish.yml, this needs the GHCR_TOKEN secret (classic PAT, write:packages for
# the lumastra organization). GitHub-hosted runners only.

on:
    push:
        tags: ['v*']
    pull_request:
        paths:
            - 'deploy/helm/**'
            - '.github/workflows/helm-publish.yml'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish, for example v0.2.0'
                required: true
                type: string
            chart_ref:
                description: 'Git ref to take the chart files from (empty = the tag)'
                required: false
                type: string

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    chart:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            REGISTRY: ghcr.io
            CHART_REPO: ghcr.io/lumastra/charts
        steps:
            - name: Work out the release tag
              id: tag
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_TAG: ${{ inputs.tag }}
                  INPUT_CHART_REF: ${{ inputs.chart_ref }}
              run: |
                  set -euo pipefail
                  case "$EVENT_NAME" in
                    push) TAG="$GITHUB_REF_NAME"; CHART_REF="$GITHUB_REF" ;;
                    workflow_dispatch) TAG="$INPUT_TAG"; CHART_REF="${INPUT_CHART_REF:-refs/tags/$INPUT_TAG}" ;;
                    *) TAG=""; CHART_REF="$GITHUB_SHA" ;;
                  esac
                  if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "::error::'$TAG' is not a release tag like v0.2.0 or v0.3.0-rc1"
                    exit 1
                  fi
                  {
                    echo "tag=$TAG"
                    echo "version=${TAG#v}"
                    echo "chart_ref=$CHART_REF"
                    echo "publish=$([ -n "$TAG" ] && echo true || echo false)"
                  } >> "$GITHUB_OUTPUT"

            - name: Check out the chart
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.tag.outputs.chart_ref }}
                  persist-credentials: false

            # The listing metadata always comes from the ref that started this run, even when
            # the chart files come from an older tag that predates the file.
            - name: Check out the listing metadata
              if: steps.tag.outputs.publish == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: workflow-src
                  sparse-checkout: deploy/helm/artifacthub-repo.yml
                  persist-credentials: false

            - name: Set up Helm
              uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

            - name: Lint
              run: helm lint deploy/helm/lumastra

            - name: Package
              id: package
              env:
                  VERSION: ${{ steps.tag.outputs.version }}
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  if [ -n "$VERSION" ]; then
                    helm package deploy/helm/lumastra --destination dist --version "$VERSION" --app-version "$VERSION"
                  else
                    helm package deploy/helm/lumastra --destination dist
                  fi
                  ls -l dist

            - name: Set up oras
              if: steps.tag.outputs.publish == 'true'
              uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

            - name: Push chart and Artifact Hub metadata
              if: steps.tag.outputs.publish == 'true'
              env:
                  # A classic PAT with write:packages for the lumastra organization. Only tag
                  # pushes and hand-started runs get here; fork PRs never see secrets.
                  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
                  OWNER: ${{ github.repository_owner }}
                  VERSION: ${{ steps.tag.outputs.version }}
              run: |
                  set -euo pipefail
                  printf '%s' "$GHCR_TOKEN" | helm registry login "$REGISTRY" --username "$OWNER" --password-stdin
                  printf '%s' "$GHCR_TOKEN" | oras login "$REGISTRY" --username "$OWNER" --password-stdin
                  helm push "dist/lumastra-${VERSION}.tgz" "oci://${CHART_REPO}"
                  # Listing metadata for Artifact Hub, tag `artifacthub.io` in the same repository.
                  oras push "${CHART_REPO}/lumastra:artifacthub.io" \
                    --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
                    workflow-src/deploy/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
